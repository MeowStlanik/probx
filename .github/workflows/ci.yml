# Lint, unit tests, web/api build, and Forge tests on every push/PR.
# Live Arc smoke stays manual (`pnpm smoke:arc`).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (forge test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: forge build
        run: forge build

      - name: forge test
        run: forge test -vv

  node:
    name: Lint · API test · build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      # Node 20 is EOL (April 2026) and tsx 4.x mis-links CJS named exports on it:
      # `import { initiateDeveloperControlledWalletsClient } from "@circle-fin/..."`
      # threw "does not provide an export named". Plain Node ESM handles it on 20 and 24
      # alike, and production builds through Next/webpack, so this only ever broke CI.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (tsc --noEmit recursive)
        run: pnpm lint

      - name: API unit tests
        run: pnpm --filter @probx/api test

      - name: API build
        run: pnpm --filter @probx/api build

      - name: Web build
        run: pnpm --filter @probx/web build
        env:
          NEXT_PUBLIC_CHAIN_ID: "5042002"
          NEXT_PUBLIC_ARC_RPC_URL: https://rpc.testnet.arc.network
          NEXT_PUBLIC_USDC_ADDRESS: "0x3600000000000000000000000000000000000000"
          NEXT_PUBLIC_MICRO_BOOST_ENGINE_ADDRESS: "0x469592aEff57eE56e910A75eA69a6538E8B59A67"
          NEXT_PUBLIC_LIQUIDITY_POOL_ADDRESS: "0xdB25f054D2D88c38FB06f74ADaD1b06e87a06De8"
          NEXT_PUBLIC_MARKET_FACTORY_ADDRESS: "0xf659eDf16E55307095a08fd29727316513acdF19"
