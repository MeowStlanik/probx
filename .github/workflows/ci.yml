# Lint, unit tests, web/api build, and Forge tests on every push/PR.
# Live Arc smoke stays manual (`pnpm smoke:arc`).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (forge test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: forge build
        run: forge build

      - name: forge test
        run: forge test -vv

  node:
    name: Lint · API test · build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (tsc --noEmit recursive)
        run: pnpm lint

      - name: API unit tests
        run: pnpm --filter @probx/api test

      - name: API build
        run: pnpm --filter @probx/api build

      - name: Web build
        run: pnpm --filter @probx/web build
        env:
          NEXT_PUBLIC_CHAIN_ID: "5042002"
          NEXT_PUBLIC_ARC_RPC_URL: https://rpc.testnet.arc.network
          NEXT_PUBLIC_USDC_ADDRESS: "0x3600000000000000000000000000000000000000"
          NEXT_PUBLIC_MICRO_BOOST_ENGINE_ADDRESS: "0xc91d548A7E3a1ddB8f4eac302cB8F5b79a7cc062"
          NEXT_PUBLIC_LIQUIDITY_POOL_ADDRESS: "0xE24acA031A4cd9B6a8e4E1fF806A2cae7a206572"
          NEXT_PUBLIC_MARKET_FACTORY_ADDRESS: "0xd71eBd51Ed53C764b38E78EAe451D86BFa47d19A"
